global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: delivery-monitoring

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ---- The monitoring stack watching itself -------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # ---- Host metrics (CPU, memory, disk, network of the deploy server) ------
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance_name: deploy-host

  # ---- Per-container CPU / memory / network / restarts ---------------------
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # ---- Applications deployed by your pipeline (auto-discovered) -----------
  # A container is scraped when it:
  #   1. is attached to the "monitoring" Docker network, and
  #   2. has the label  monitoring.scrape=true
  # Other labels: monitoring.port, monitoring.path, monitoring.app,
  # monitoring.env, monitoring.version.
  - job_name: deployed-apps
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_monitoring_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: monitoring
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_monitoring_port]
        regex: "(.+);(.+)"
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_docker_container_label_monitoring_path]
        regex: "(.+)"
        target_label: __metrics_path__
      - source_labels: [__meta_docker_container_label_monitoring_app]
        target_label: app
      - source_labels: [__meta_docker_container_label_monitoring_env]
        target_label: env
      - source_labels: [__meta_docker_container_label_monitoring_version]
        target_label: version
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      # Fall back to the container name when monitoring.app is not set
      - source_labels: [app, container]
        regex: ";(.+)"
        replacement: "$1"
        target_label: app

  # ---- Targets outside Docker (VMs, bare-metal services) -------------------
  - job_name: file-apps
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
        refresh_interval: 30s
