groups:
  # ------------------------------------------------------------------ apps
  - name: deployed-apps
    rules:
      - alert: AppDown
        expr: up{job="deployed-apps"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.app }} is down"
          description: "Prometheus cannot scrape {{ $labels.app }} ({{ $labels.container }}, version {{ $labels.version }}) for over 1 minute."

      - alert: AppFlapping
        expr: changes(up{job="deployed-apps"}[10m]) > 4
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.app }} is flapping"
          description: "{{ $labels.app }} changed up/down state {{ $value }} times in 10 minutes."

      - alert: HighErrorRate
        expr: |
          sum by (app) (rate(http_requests_total{job="deployed-apps",code=~"5.."}[5m]))
            /
          sum by (app) (rate(http_requests_total{job="deployed-apps"}[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.app }} 5xx error rate above 5%"
          description: "{{ $labels.app }} is returning {{ $value | humanizePercentage }} 5xx responses."

  # ------------------------------------------------------------ containers
  - name: containers
    rules:
      - alert: ContainerCrashLoop
        expr: changes(container_start_time_seconds{container_label_monitoring_app!=""}[15m]) > 2
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.container_label_monitoring_app }} is restarting repeatedly"
          description: "Container {{ $labels.name }} restarted {{ $value }} times in 15 minutes. Likely a failed deploy."

      - alert: ContainerDisappeared
        expr: time() - container_last_seen{container_label_monitoring_app!=""} > 60
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.container_label_monitoring_app }} container not seen"
          description: "Container {{ $labels.name }} has not been seen for {{ $value | humanizeDuration }}."

      - alert: ContainerHighCPU
        expr: |
          sum by (name, container_label_monitoring_app)
            (rate(container_cpu_usage_seconds_total{container_label_monitoring_app!=""}[5m])) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.container_label_monitoring_app }} using high CPU"
          description: "{{ $labels.name }} has used {{ $value | humanize }} cores for 10 minutes."

      - alert: ContainerNearMemoryLimit
        expr: |
          container_memory_working_set_bytes{container_label_monitoring_app!=""}
            / (container_spec_memory_limit_bytes{container_label_monitoring_app!=""} > 0) > 0.90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.container_label_monitoring_app }} near its memory limit"
          description: "{{ $labels.name }} is at {{ $value | humanizePercentage }} of its memory limit (OOM-kill risk)."

  # ------------------------------------------------------------------ host
  - name: host
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Node exporter on the deploy host is unreachable"

      - alert: HostHighCPU
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Host CPU above 85%"
          description: "Host CPU usage is {{ $value | humanize }}%."

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Host memory above 90%"
          description: "Host memory usage is {{ $value | humanize }}%."

      - alert: HostDiskSpaceLow
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
             / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} over 85% full"
          description: "Old images and logs from deploys are the usual cause (docker system prune)."

      - alert: HostDiskFillingUp
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} predicted to fill within 24h"

  # -------------------------------------------------- the platform itself
  - name: monitoring-stack
    rules:
      - alert: MonitoringTargetDown
        expr: up{job=~"prometheus|alertmanager|grafana|cadvisor"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Monitoring component {{ $labels.job }} is down"
